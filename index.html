<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://cdn.datatables.net https://code.jquery.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.datatables.net; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#1d5fc4">
<title>Dashboard Briguna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Layar login -->
<section id="login" class="login" hidden>
  <div class="login-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <form id="loginForm" class="glass" autocomplete="on" novalidate>
    <div class="brandline"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div><b id="appName">Dashboard Briguna</b><small>Kinerja &amp; Tools RM</small></div></div>
    <h1>Masuk</h1>
    <label class="fld"><span>Username</span><input id="lgUser" class="inp" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" required></label>
    <label class="fld"><span>Password</span><input id="lgPass" class="inp" type="password" autocomplete="current-password" maxlength="100" required></label>
    <p id="lgMsg" class="msg" role="alert" hidden></p>
    <button class="btn primary w-full" id="lgBtn" type="submit">Masuk</button>
    <p class="fine">Akses Admin, RM, atau Guest diberikan oleh admin. Sesi berakhir otomatis setelah tidak aktif.</p>
  </form>
</section>

<!-- Aplikasi -->
<div id="app" class="app" hidden>
  <nav class="nav" aria-label="Menu utama">
    <div class="nav-brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div><b>Dashboard Briguna</b><small>RO Medan</small></div></div>
    <a href="#dashboard" data-v="dashboard" data-perm="dashboard"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></a>
    <a href="#debitur" data-v="debitur" data-perm="debitur"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h3M8 16h6"/></svg><span>Detail Debitur</span></a>
    <a href="#tools" data-v="tools" data-perm="tools"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8M8 11h.01M12 11h.01M16 11h.01M8 14.5h.01M12 14.5h.01M16 14.5h.01M8 18h.01M12 18h4"/></svg><span>Tools RM</span></a>
    <a href="#admin" data-v="admin" data-perm="admin"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.4-5.5 7-5.5s6.2 1.9 7 5.5"/><path d="M19 3v4M17 5h4"/></svg><span>Admin</span></a>
  </nav>
  <div class="main">
    <header class="topbar">
      <div class="min-w-0"><div class="eyebrow" id="eyebrow">Dashboard Briguna</div><h1 id="pageTitle">Dashboard</h1></div>
      <div class="flex items-center gap-2 flex-wrap justify-end">
        <span class="sync-st" id="syncSt"></span>
        <button class="btn ghost" id="btnSync" type="button" title="Ambil data terbaru dari Google Sheets"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7"/><path d="M18 2v4.5h-4.5M6 22v-4.5h4.5"/></svg><span>Sync</span></button>
        <button class="btn ghost icon" id="btnTheme" type="button" aria-label="Ganti tema terang/gelap" title="Tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <div class="user-menu">
          <button class="btn ghost" id="btnUser" type="button" aria-haspopup="true" aria-expanded="false"><span class="av" id="uAv">?</span><span class="u-txt"><b id="uName">-</b><small id="uRole">-</small></span></button>
          <div class="menu" id="userMenu" hidden>
            <button type="button" id="umPw">Ganti password</button>
            <button type="button" id="umOut">Keluar</button>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- Modal detail -->
<dialog id="dlg"><div class="dlg-h"><h2 id="dlgTitle">Detail</h2><button class="btn ghost icon" type="button" data-close aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="dlg-b" id="dlgBody"></div></dialog>
<div id="boot" class="boot"><span class="spin" aria-hidden="true"></span><span id="bootMsg">Memuat…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
